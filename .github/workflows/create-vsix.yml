name: create-vsix
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch name which should be used to build the vsix"
        required: true
jobs:
  create-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "18.18.2"
      - name: Load local npm cache for node ${{ env.NODE_VERSION }}
        uses: MasterworksIO/action-local-cache@2
        with:
          path: .npm
          key: ${{ env.NODE_VERSION }}
          strategy: move
      - run: npm ci --cache .npm
      - run: npx ts-node scripts/create-vsix.ts ${{ github.event.inputs.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-brightscript-language.vsix
          path: .vsix-building/vscode-brightscript-language/*.vsix
