name: create-vsix
on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "What to build: a PR number (for this repo), a full PR URL (for any repo), or a branch name"
        required: true
jobs:
  create-vsix:
    runs-on: ubuntu-latest
    # for the pull_request trigger, only run when this repo's own PRs are labeled create-vsix. workflow_dispatch (from this
    # repo or any other rokucommunity project) is always allowed
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'create-vsix')
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "20.19.4"
      # Resolve the branch to build and (optionally) the PR to comment on
      - name: Resolve build info
        uses: actions/github-script@v7
        id: info
        with:
          script: |
            let input;
            if (context.eventName === 'pull_request') {
              input = context.payload.pull_request.html_url;
            } else {
              input = `${{ github.event.inputs.pr }}`.trim();
            }
            if (!input) {
              core.setFailed('You must provide a PR number, PR URL, or branch name');
              return;
            }
            //`pr` can be a full PR URL (any repo), a plain PR number (this repo), or a branch name
            let prOwner, prRepo, prNumber;
            const urlMatch = /github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/.exec(input);
            if (urlMatch) {
              [, prOwner, prRepo, prNumber] = urlMatch;
            } else if (/^\d+$/.test(input)) {
              prOwner = context.repo.owner;
              prRepo = context.repo.repo;
              prNumber = input;
            }
            let branch;
            let forkOwner = '';
            if (prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: prOwner,
                repo: prRepo,
                pull_number: Number(prNumber)
              });
              branch = pr.head.ref;
              //when the PR comes from a fork, remember the fork owner so the build can also consider
              //that owner's same-named branches (when attached to open PRs) on the other projects
              if (pr.head.repo.owner.login !== prOwner) {
                forkOwner = pr.head.repo.owner.login;
              }
              core.setOutput('prOwner', prOwner);
              core.setOutput('prRepo', prRepo);
              core.setOutput('prNumber', prNumber);
              core.setOutput('prSha', pr.head.sha);
              console.log(`PR: ${prOwner}/${prRepo}#${prNumber} @ ${pr.head.sha}${forkOwner ? ` (fork owner: ${forkOwner})` : ''}`);
            } else {
              //not a PR number or URL, so treat the input as a branch name
              branch = input.replace(/^refs\/heads\//, '');
            }
            core.setOutput('branch', branch);
            core.setOutput('forkOwner', forkOwner);
            console.log(`branch: "${branch}"`);
      # GitHub withholds repository secrets from fork-triggered runs, so fail fast with a clear message
      - name: Reject fork PRs
        if: github.event.pull_request.head.repo.fork
        run: |
          echo "::error::Could not build a .vsix because fork PRs can't access the required secrets. Ask a maintainer to dispatch it manually for PR #${{ github.event.pull_request.number }}: https://github.com/${{ github.repository }}/actions/workflows/create-vsix.yml"
          exit 1
      - run: npm ci
      - run: npx ts-node scripts/create-vsix.ts "${{ steps.info.outputs.branch }}" --fork-owner "${{ steps.info.outputs.forkOwner }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # upload the production .vsix (archive: false only supports a single file, so
      # upload each .vsix as its own artifact: upload, delete, repackage, upload again)
      - uses: actions/upload-artifact@v7
        with:
          name: brightscript.vsix
          path: .vsix-building/vscode-brightscript-language/*.vsix
          archive: false
      - run: rm .vsix-building/vscode-brightscript-language/*.vsix
      # repackage the extension as the side-by-side "temporary" variant and upload it
      - run: npx ts-node scripts/create-temp-vsix.ts
      - uses: actions/upload-artifact@v7
        with:
          name: brightscript-temp.vsix
          path: .vsix-building/vscode-brightscript-language/*.vsix
          archive: false
      # Look up this run's artifacts and print their download URLs
      - name: Get artifact download URLs
        uses: actions/github-script@v7
        id: artifacts
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifacts = response.data.artifacts.map(a => ({
              name: a.name,
              id: a.id,
              url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id}`
            }));
            console.log(`Found ${artifacts.length} artifact(s) for run ${context.runId}`);
            for (const artifact of artifacts) {
              console.log(`${artifact.name}: ${artifact.url}`);
            }
            console.log('\nFull artifact JSON:');
            console.log(JSON.stringify(response.data.artifacts, null, 2));
            core.setOutput('artifacts', JSON.stringify(artifacts));
      # When building for a PR, get a bot token so the bot's name shows up on the comment
      - name: Get Token From roku-ci-token Application
        if: steps.info.outputs.prNumber
        uses: tibdex/github-app-token@v1.5.1
        id: generate-token
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Post download links on the PR
        if: steps.info.outputs.prNumber
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const artifacts = ${{ steps.artifacts.outputs.artifacts }};
            const sha = '${{ steps.info.outputs.prSha }}';

            //upload-artifact names the artifact after the matched file (which includes the version/timestamp), so match by prefix
            const temp = artifacts.find(a => a.name.startsWith('brightscript-temp'));
            const prod = artifacts.find(a => a.name.startsWith('brightscript-') && a !== temp);

            let body = 'Hey there! I just built a new version of the vscode extension based on [' + sha.substring(0, 7) + '](https://github.com/' + '${{ steps.info.outputs.prOwner }}' + '/' + '${{ steps.info.outputs.prRepo }}' + '/commit/' + sha + ').\n\n';
            body += '### 📦 [Download the .vsix](' + prod.url + ')\n';
            body += 'See the [install instructions](https://rokucommunity.github.io/vscode-brightscript-language/prerelease-versions.html) if you need them. This replaces your marketplace version of the extension until you reinstall it.\n\n';

            body += '<sub>_Prefer to keep the marketplace version installed? There\'s also a [side-by-side build](' + temp.url + ') that installs as a separate extension. Be sure to disable the marketplace version while testing it, otherwise the two will conflict._</sub>\n\n';

            //include the per-project sources so testers can see exactly what went into this build
            try {
              const buildInfo = JSON.parse(require('fs').readFileSync('.vsix-building/build-info.json', 'utf8'));
              body += '| package | source |\n';
              body += '| :--- | :--- |\n';
              for (const project of buildInfo) {
                body += '| `' + project.name + '` | ' + project.source + ' |\n';
              }
            } catch (e) {
              console.log('Could not read build-info.json:', e.message);
            }

            await github.rest.issues.createComment({
              owner: '${{ steps.info.outputs.prOwner }}',
              repo: '${{ steps.info.outputs.prRepo }}',
              issue_number: ${{ steps.info.outputs.prNumber }},
              body: body
            });
