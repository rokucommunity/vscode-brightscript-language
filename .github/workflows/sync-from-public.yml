name: Sync from public

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Get bot token
        uses: tibdex/github-app-token@v1.5.1
        id: generate-token
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Fetch latest public master
        run: |
          git remote add public https://github.com/rokucommunity/vscode-brightscript-language.git
          git fetch public master

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          PUBLIC_SHA=$(git rev-parse --short public/master)
          BRANCH_NAME="sync-public-${PUBLIC_SHA}"

          # Check if a branch already exists for this commit
          if git ls-remote --exit-code origin "refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH_NAME} already exists. Skipping."
            exit 0
          fi

          # Create branch from public/master and push to private
          git checkout -b "${BRANCH_NAME}" public/master
          git push origin "${BRANCH_NAME}"

          # Open PR
          gh pr create \
            --base master \
            --head "${BRANCH_NAME}" \
            --title "Sync from public master (${PUBLIC_SHA})" \
            --body "Automated sync of public master at commit \`$(git rev-parse public/master)\`."
