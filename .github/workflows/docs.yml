#builds the docs site and deploys it to GitHub Pages
name: docs
on:
  push:
    branches:
      - master
      #TEMPORARY: publish from the docs website PR branch so the new site can be compared before merging. Remove before merging.
      - docs-website
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      - run: npm run build-docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

      - id: deployment
        uses: actions/deploy-pages@v5
